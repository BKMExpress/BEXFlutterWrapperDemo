name: bex_flutter
description: Flutter wrapper for BKM Express Full SDK (Android + iOS).
version: 0.1.0
homepage: https://www.bkmexpress.com.tr
repository: https://github.com/BKMExpress/bex-flutter

# Distributed via git; do not publish to pub.dev.
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.bkm.bexflutter
        pluginClass: BexFlutterPlugin
      ios:
        pluginClass: BexFlutterPlugin
